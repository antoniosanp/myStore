server:
  port: ${PORT:8081}

spring:
  application:
    name: payment

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5673}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

app:
  rabbitmq:
    exchange: orders.exchange
    order-created-queue: order.created.queue
    order-created-routing-key: order.created.key
    payment-completed-queue: payment.completed.queue
    payment-completed-routing-key: payment.completed.key
  mercadopago:
    access-token: ${MERCADOPAGO_ACCESS_TOKEN}
    back-url:
      success: http://localhost:3000/payment/success
      failure: http://localhost:3000/payment/failure
      pending: http://localhost:3000/payment/pending
    notification-url: http://localhost:8081/api/v1/payments/webhook

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
